# Enforces the persistent integration-branch workflow. Both protected branches
# still rely on rulesets for PRs, merge methods, and CI; this check answers the
# one question rulesets cannot express: which head branches may target main.
name: Branch flow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: branch-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: branch-flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Check whether the persistent dev branch exists.
    env:
      ACTOR: ${{ github.event.pull_request.user.login }}
      BASE: ${{ github.event.pull_request.base.ref }}
      BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      HEAD: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate pull request direction
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import subprocess
          import sys

          actor = os.environ["ACTOR"]
          base = os.environ["BASE"]
          base_repo = os.environ["BASE_REPO"]
          head = os.environ["HEAD"]
          head_repo = os.environ["HEAD_REPO"]
          repository = os.environ["REPOSITORY"]
          same_repository = base_repo == head_repo == repository


          def summary(message: str) -> None:
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as handle:
                      handle.write(f"### Branch flow\n\n{message}\n")


          if base != "main":
              message = f"`{head}` may target `{base}`; main-only source restrictions do not apply."
              print(message)
              summary(message)
              sys.exit(0)

          if same_repository and head == "dev":
              message = "Accepted release PR from `dev` to `main`."
              print(message)
              summary(message)
              sys.exit(0)

          if same_repository and head.startswith("hotfix/"):
              message = "Accepted hotfix PR to `main`; backport the merged fix to `dev`."
              print(message)
              summary(message)
              sys.exit(0)

          if (
              same_repository
              and actor == "dependabot[bot]"
              and head.startswith("dependabot/")
          ):
              message = "Accepted Dependabot security PR to `main`; backport it to `dev`."
              print(message)
              summary(message)
              sys.exit(0)

          # This exact branch bootstraps the workflow while `dev` does not yet
          # exist. Once setup-repo.sh creates protected `dev`, the exception can
          # no longer pass and ordinary PRs to main remain rejected.
          if same_repository and head == "ci/10-adopt-dev-workflow":
              result = subprocess.run(
                  ["gh", "api", f"repos/{repository}/branches/dev"],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if result.returncode != 0:
                  message = "Accepted the one-time workflow bootstrap before `dev` exists."
                  print(message)
                  summary(message)
                  sys.exit(0)

          message = (
              f"PRs into `main` must come from this repository's `dev` or "
              "`hotfix/*` branch, or from a Dependabot security-update branch. "
              f"Received `{head_repo}:{head}` from `{actor}`."
          )
          print(f"::error title=Invalid PR target::{message}")
          summary(message)
          sys.exit(1)
          PY
